<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  />
  <title>SAVE Arcade Emulator</title>

  <style>
    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #000;
      overflow: hidden;
    }

    body {
      color: #f2efe6;
      font-family: Inter, Arial, sans-serif;
    }

    #launch-hint {
      position: fixed;
      z-index: 999;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: min(720px, calc(100% - 32px));
      box-sizing: border-box;
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.78);
      color: #f2efe6;
      font-size: 13px;
      line-height: 1.4;
      text-align: center;
      pointer-events: none;
      backdrop-filter: blur(8px);
    }

    #launch-hint[hidden] {
      display: none;
    }

    #error {
      position: fixed;
      z-index: 2000;
      inset: 0;
      display: grid;
      place-items: center;
      box-sizing: border-box;
      padding: 28px;
      background: #000;
      color: #f2efe6;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 14px;
      line-height: 1.5;
      text-align: center;
      white-space: pre-wrap;
    }

    #error[hidden] {
      display: none;
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="launch-hint">
    Если игра не запустилась автоматически — нажмите «ЗАГРУЗИТЬ ИГРУ»
    или кликните по экрану.
  </div>

  <div id="error" hidden></div>

  <script>
    (function () {
      var launchHint = document.getElementById('launch-hint');
      var errorBox = document.getElementById('error');
      var params = new URLSearchParams(window.location.search);
      var core = (params.get('core') || '').toLowerCase();
      var rom = params.get('rom') || '';
      var name = params.get('name') || 'NES Game';
      var allowedCores = ['nes', 'fceumm', 'nestopia'];
      var allowedInputIndexes = [0, 2, 3, 4, 5, 6, 7, 8];
      var pendingInputs = new Map();
      var gameStarted = false;

      function fail(message) {
        errorBox.hidden = false;
        errorBox.textContent = message;
      }

      function parseTopLaunchContext() {
        try {
          var hash = window.top.location.hash || '';
          var q = hash.indexOf('?');
          var route = q >= 0 ? hash.slice(1, q) : hash.slice(1);
          var query = new URLSearchParams(q >= 0 ? hash.slice(q + 1) : '');
          var match = route.match(/^\/play\/([^/?#]+)/);

          return {
            gameId: match ? decodeURIComponent(match[1]) : '',
            launchId: query.get('launch') || ''
          };
        } catch (error) {
          return {
            gameId: '',
            launchId: ''
          };
        }
      }

      function notifyGameCardStarted() {
        var context = parseTopLaunchContext();

        if (!context.gameId || !context.launchId) {
          return;
        }

        try {
          var opener = window.top.opener;

          if (opener && !opener.closed) {
            opener.postMessage(
              {
                source: 'save-arcade-player',
                type: 'game_started',
                gameId: context.gameId,
                launchId: context.launchId
              },
              window.location.origin
            );
          }
        } catch (error) {
          // Referral notification must never break the game.
        }
      }

      function gameManager() {
        return (
          window.EJS_emulator &&
          window.EJS_emulator.gameManager &&
          typeof window.EJS_emulator.gameManager.simulateInput === 'function'
        )
          ? window.EJS_emulator.gameManager
          : null;
      }

      function applyInput(index, value) {
        var manager = gameManager();

        if (!manager) {
          pendingInputs.set(index, value);
          return;
        }

        manager.simulateInput(0, index, value);
      }

      function flushInputs() {
        var manager = gameManager();

        if (!manager) {
          return;
        }

        pendingInputs.forEach(function (value, index) {
          manager.simulateInput(0, index, value);
        });

        pendingInputs.clear();
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) {
          return;
        }

        var data = event.data;

        if (
          !data ||
          data.source !== 'save-arcade-player' ||
          data.type !== 'nes-input'
        ) {
          return;
        }

        var index = Number(data.index);
        var value = data.value === 1 ? 1 : 0;

        if (allowedInputIndexes.indexOf(index) === -1) {
          return;
        }

        applyInput(index, value);
      });

      window.addEventListener('error', function (event) {
        if (!gameStarted) {
          fail(
            'Emulator error: ' +
            (event && event.message ? event.message : 'unknown error')
          );
        }
      });

      window.addEventListener('unhandledrejection', function (event) {
        if (!gameStarted) {
          var reason = event && event.reason;
          fail(
            'Emulator promise error: ' +
            (reason && reason.message ? reason.message : String(reason || 'unknown'))
          );
        }
      });

      if (allowedCores.indexOf(core) === -1) {
        fail('Unsupported emulator core.');
        return;
      }

      if (!rom) {
        fail('ROM URL is missing.');
        return;
      }

      var romUrl;

      try {
        romUrl = new URL(rom, window.location.href);
      } catch (error) {
        fail('ROM URL is invalid.');
        return;
      }

      if (romUrl.origin !== window.location.origin) {
        fail('ROM must be same-origin.');
        return;
      }

      var canAutoStart =
        !!(
          navigator.userActivation &&
          navigator.userActivation.isActive
        );

      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_controlScheme = 'nes';
      window.EJS_gameName = name;
      window.EJS_gameUrl = romUrl.href;

      // Start automatically only if the browser actually exposes an active
      // user gesture in this new tab. Otherwise use EmulatorJS native start UI.
      window.EJS_startOnLoaded = canAutoStart;
      window.EJS_startButtonName = 'ЗАГРУЗИТЬ ИГРУ';

      window.EJS_CacheLimit = 1;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/';
      window.EJS_color = '#B94732';
      window.EJS_backgroundColor = '#000000';
      window.EJS_browserMode = 'desktop';

      window.EJS_onGameStart = function () {
        gameStarted = true;
        launchHint.hidden = true;
        flushInputs();
        notifyGameCardStarted();
      };

      window.EJS_ready = function () {
        flushInputs();
      };

      var loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/4.2.3/data/loader.js';
      loader.async = true;

      loader.onerror = function () {
        fail('Could not load EmulatorJS.');
      };

      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
