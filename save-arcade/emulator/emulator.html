<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
  />
  <title>SAVE Arcade Emulator</title>

  <style>
    :root {
      color-scheme: dark;
      --save-accent: #c84d37;
      --save-text: #f4f1e8;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body,
    #game {
      width: 100%;
      height: 100%;
      margin: 0;
    }

    html,
    body {
      background: #000;
      overflow: hidden;
    }

    body {
      position: relative;
      color: var(--save-text);
      font-family: Inter, Arial, sans-serif;
    }

    #game {
      position: absolute;
      inset: 0;
      background: #000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 140ms ease-out;
    }

    body[data-state="running"] #game {
      opacity: 1;
      pointer-events: auto;
    }

    #game .ejs_start_button {
      opacity: 0 !important;
      pointer-events: none !important;
    }

    #save-launch {
      position: absolute;
      z-index: 1000;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      opacity: 1;
      transition: opacity 140ms ease-out;
    }

    body[data-state="running"] #save-launch {
      opacity: 0;
      pointer-events: none;
    }

    .save-poster {
      position: relative;
      width: min(84vw, 920px);
      height: min(72vh, 620px);
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #000;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .save-poster[data-ready="true"] {
      cursor: pointer;
    }

    .save-poster__image {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      image-rendering: pixelated;
      filter: brightness(0.78);
      background: #000;
      pointer-events: none;
    }

    .save-poster__shade {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(0, 0, 0, 0.02) 0%,
          rgba(0, 0, 0, 0.1) 42%,
          rgba(0, 0, 0, 0.34) 100%
        );
      pointer-events: none;
    }

    .save-play {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(86px, 9vw, 112px);
      height: clamp(86px, 9vw, 112px);
      transform: translate(-50%, -50%) scale(0.94);
      border: 0;
      border-radius: 50%;
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--save-accent);
      box-shadow:
        0 12px 34px rgba(0, 0, 0, 0.52),
        0 0 0 1px rgba(255, 255, 255, 0.16);
      opacity: 0;
      cursor: pointer;
      transition:
        transform 130ms ease,
        opacity 130ms ease,
        box-shadow 130ms ease;
      -webkit-tap-highlight-color: transparent;
    }

    .save-poster[data-ready="true"] .save-play {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .save-play:hover {
      transform: translate(-50%, -50%) scale(1.06) !important;
      box-shadow:
        0 16px 42px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.24);
    }

    .save-play:active {
      transform: translate(-50%, -50%) scale(0.96) !important;
    }

    .save-play__triangle {
      width: 0;
      height: 0;
      margin-left: 8px;
      border-top: 18px solid transparent;
      border-bottom: 18px solid transparent;
      border-left: 29px solid #fff;
      pointer-events: none;
    }

    .save-caption {
      position: absolute;
      z-index: 2;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      color: rgba(244, 241, 232, 0.76);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      pointer-events: none;
    }

    @media (max-width: 680px) {
      .save-poster {
        width: 94vw;
        height: 68vh;
      }

      .save-play {
        width: 86px;
        height: 86px;
      }

      .save-play__triangle {
        margin-left: 6px;
        border-top-width: 15px;
        border-bottom-width: 15px;
        border-left-width: 24px;
      }

      .save-caption {
        bottom: 12px;
        font-size: 11px;
      }
    }
  </style>
</head>

<body data-state="boot">
  <div id="game"></div>

  <div id="save-launch" aria-label="Играть">
    <div id="save-poster" class="save-poster" data-ready="false">
      <img
        id="save-poster-image"
        class="save-poster__image"
        alt=""
        draggable="false"
      />
      <div class="save-poster__shade"></div>

      <button
        id="save-play"
        class="save-play"
        type="button"
        aria-label="Играть"
      >
        <span class="save-play__triangle"></span>
      </button>

      <div class="save-caption">Играть</div>
    </div>
  </div>

  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var core = (params.get('core') || '').toLowerCase();
      var rom = params.get('rom') || '';
      var name = params.get('name') || 'NES Game';

      var poster = document.getElementById('save-poster');
      var posterImage = document.getElementById('save-poster-image');
      var playButton = document.getElementById('save-play');

      var allowedCores = ['nes', 'fceumm', 'nestopia'];
      var allowedInputIndexes = [0, 2, 3, 4, 5, 6, 7, 8];
      var pendingInputs = new Map();

      var gameStarted = false;
      var nativeStartButton = null;
      var startPollTimer = null;

      function parsePlayerContext() {
        try {
          var hash = window.top.location.hash || '';
          var queryIndex = hash.indexOf('?');
          var route =
            queryIndex >= 0 ? hash.slice(1, queryIndex) : hash.slice(1);
          var query = new URLSearchParams(
            queryIndex >= 0 ? hash.slice(queryIndex + 1) : ''
          );
          var match = route.match(/^\/play\/([^/?#]+)/);
          var gameId = match ? decodeURIComponent(match[1]) : '';

          return {
            gameId: gameId,
            launchId: query.get('launch') || ''
          };
        } catch (error) {
          return {
            gameId: '',
            launchId: ''
          };
        }
      }

      function gameAssetParts(gameId) {
        var dash = gameId.indexOf('-');

        if (dash <= 0 || dash >= gameId.length - 1) {
          return null;
        }

        return {
          consoleId: gameId.slice(0, dash),
          slug: gameId.slice(dash + 1)
        };
      }

      function previewCandidates() {
        var context = parsePlayerContext();
        var parts = gameAssetParts(context.gameId);

        if (!parts) {
          return [];
        }

        var base =
          '../assets/games/' +
          encodeURIComponent(parts.consoleId) +
          '/' +
          parts.slug
            .split('/')
            .map(encodeURIComponent)
            .join('/') +
          '/';

        return [
          new URL(base + 'screenshot-01.png', window.location.href).href,
          new URL(base + 'screenshot-02.png', window.location.href).href,
          new URL(base + 'cover.png', window.location.href).href
        ];
      }

      function setPosterImage() {
        var candidates = previewCandidates();
        var index = 0;

        if (candidates.length === 0) {
          return;
        }

        function next() {
          if (index >= candidates.length) {
            posterImage.removeAttribute('src');
            return;
          }

          posterImage.src = candidates[index];
          index += 1;
        }

        posterImage.addEventListener('error', next);
        next();
      }

      function notifyGameCardStarted() {
        var context = parsePlayerContext();

        if (!context.gameId || !context.launchId) {
          return;
        }

        try {
          var opener = window.top.opener;

          if (opener && !opener.closed) {
            opener.postMessage(
              {
                source: 'save-arcade-player',
                type: 'game_started',
                gameId: context.gameId,
                launchId: context.launchId
              },
              window.location.origin
            );
          }
        } catch (error) {
          // Referral notification must never block the game.
        }
      }

      function gameManager() {
        return (
          window.EJS_emulator &&
          window.EJS_emulator.gameManager &&
          typeof window.EJS_emulator.gameManager.simulateInput === 'function'
        )
          ? window.EJS_emulator.gameManager
          : null;
      }

      function applyInput(index, value) {
        var manager = gameManager();

        if (!manager) {
          pendingInputs.set(index, value);
          return;
        }

        manager.simulateInput(0, index, value);
      }

      function flushInputs() {
        var manager = gameManager();

        if (!manager) {
          return;
        }

        pendingInputs.forEach(function (value, index) {
          manager.simulateInput(0, index, value);
        });

        pendingInputs.clear();
      }

      function setStartReady(button) {
        nativeStartButton = button;
        poster.setAttribute('data-ready', 'true');

        var active =
          !!(
            navigator.userActivation &&
            navigator.userActivation.isActive
          );

        if (active) {
          button.click();
        }
      }

      function findNativeStartButton() {
        if (gameStarted || nativeStartButton) {
          return;
        }

        var button = document.querySelector('#game .ejs_start_button');

        if (button) {
          if (startPollTimer) {
            clearInterval(startPollTimer);
            startPollTimer = null;
          }

          setStartReady(button);
        }
      }

      function requestStart() {
        if (!nativeStartButton || gameStarted) {
          return;
        }

        // This click occurs synchronously inside the user's click handler,
        // so browser user activation is preserved.
        nativeStartButton.click();
      }

      playButton.addEventListener('click', requestStart);
      poster.addEventListener('click', function (event) {
        if (event.target === playButton) {
          return;
        }

        requestStart();
      });

      window.addEventListener('message', function (event) {
        if (event.origin !== window.location.origin) {
          return;
        }

        var data = event.data;

        if (
          !data ||
          data.source !== 'save-arcade-player' ||
          data.type !== 'nes-input'
        ) {
          return;
        }

        var index = Number(data.index);
        var value = data.value === 1 ? 1 : 0;

        if (allowedInputIndexes.indexOf(index) === -1) {
          return;
        }

        applyInput(index, value);
      });

      if (allowedCores.indexOf(core) === -1 || !rom) {
        return;
      }

      var romUrl;

      try {
        romUrl = new URL(rom, window.location.href);
      } catch (error) {
        return;
      }

      if (romUrl.origin !== window.location.origin) {
        return;
      }

      setPosterImage();

      window.EJS_player = '#game';
      window.EJS_core = core;
      window.EJS_controlScheme = 'nes';
      window.EJS_gameName = name;
      window.EJS_gameUrl = romUrl.href;

      // Native EJS start UI stays hidden under the SAVE overlay.
      // We click that native start control from our own PLAY overlay.
      window.EJS_startOnLoaded = false;
      window.EJS_startButtonName = 'PLAY';

      window.EJS_CacheLimit = 1;
      window.EJS_pathtodata = 'https://cdn.emulatorjs.org/4.2.3/data/';
      window.EJS_color = '#C84D37';
      window.EJS_backgroundColor = '#000000';
      window.EJS_browserMode = 'desktop';

      window.EJS_onGameStart = function () {
        gameStarted = true;

        if (startPollTimer) {
          clearInterval(startPollTimer);
          startPollTimer = null;
        }

        document.body.setAttribute('data-state', 'running');
        flushInputs();
        notifyGameCardStarted();
      };

      window.EJS_ready = function () {
        flushInputs();
        findNativeStartButton();
      };

      var loader = document.createElement('script');
      loader.src = 'https://cdn.emulatorjs.org/4.2.3/data/loader.js';
      loader.async = true;

      loader.addEventListener('load', function () {
        findNativeStartButton();

        if (!nativeStartButton) {
          startPollTimer = setInterval(findNativeStartButton, 50);
        }
      });

      document.body.appendChild(loader);
    })();
  </script>
</body>
</html>
